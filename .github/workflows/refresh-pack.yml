name: Refresh mod update index
on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'updater/refresh_index.py'
      - '.github/workflows/refresh-pack.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-pack-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Refresh hashes
        run: python3 updater/refresh_index.py .
      - name: Commit generated index when needed
        run: |
          if git diff --quiet -- pack.toml index.toml; then
            echo 'Index already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pack.toml index.toml
          git commit -m 'Refresh automatic mod update index'
          git push origin HEAD:main
